<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private CA</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:10px;
border:none;
border-radius:8px;
}

button{
padding:12px;
width:100%;
border:none;
border-radius:8px;
cursor:pointer;
}

pre{
overflow:auto;
background:black;
padding:10px;
margin-top:20px;
}
</style>

</head>
<body>

<h1>Private CA</h1>

<div class="card">

<input id="owner" placeholder="Owner Name">

<input id="project" placeholder="Project Name">

<input id="domain" placeholder="Domain">

<input id="email" placeholder="Email">

<button onclick="generateCert()">
Generate Certificate
</button>

</div>

<pre id="result"></pre>

<script src="app.js"></script>

</body>
</html>
